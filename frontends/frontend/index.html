<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<title>VersaTiles</title>
		<meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no" />
		<link rel="icon" type="image/png" href="/assets/images/versatiles-logo.png" />

		<script defer src="/assets/lib/maplibre-gl/maplibre-gl.js"></script>
		<link href="/assets/lib/maplibre-gl/maplibre-gl.css" rel="stylesheet" />

		<script defer src="/assets/lib/versatiles-geocoder/versatiles-geocoder.js"></script>
		<link href="/assets/lib/versatiles-geocoder/versatiles-geocoder.css" rel="stylesheet" />

		<script defer src="/assets/lib/maplibre-versatiles-styler/maplibre-versatiles-styler.js"></script>

		<script defer src="/assets/lib/versatiles-svg-renderer/versatiles-svg-renderer.js"></script>

		<script defer src="/assets/lib/maplibre-gl-inspect/maplibre-gl-inspect.js"></script>
		<link href="/assets/lib/maplibre-gl-inspect/maplibre-gl-inspect.css" rel="stylesheet" />
	</head>

	<body style="margin: 0; height: 100%">
		<a href="https://versatiles.org" style="position: absolute; bottom: 1em; left: 1em; z-index: 1">
			<img src="/assets/images/versatiles-logo.png" alt="VersaTiles" width="32" />
		</a>
		<div id="map" class="maplibregl-compact" style="position: absolute; top: 0; bottom: 0; width: 100%"></div>
		<script>
			// The library tags above are deferred, so they have not run yet while this inline
			// script is parsed. DOMContentLoaded fires once they have all executed.
			document.addEventListener('DOMContentLoaded', () => {
				// Not `bounds`: it overrides `zoom` in the constructor, and full-world bounds put the
				// box corners on the far side of the sphere, which no zoom can fit. MapLibre's globe
				// has a pixel radius of 512 * 2**zoom / (2*PI), so a fixed zoom means a fixed-size
				// planet whatever the window is -- zoom 0 is a ~150px marble. Inverted and rounded,
				// this holds the globe at 81-92% of the shorter viewport side, phone to desktop.
				const container = document.getElementById('map');
				const map = new maplibregl.Map({
					container,
					center: [18, 25],
					zoom: Math.log2(Math.min(container.clientWidth, container.clientHeight)) - 7.4,
				});

				map.addControl(new maplibregl.NavigationControl(), 'top-right');
				map.addControl(
					new maplibregl.GeolocateControl({
						positionOptions: { enableHighAccuracy: true },
						trackUserLocation: true,
					}),
					'top-right'
				);
				map.addControl(
					new MaplibreInspect({
						sources: {
							'versatiles-shortbread': [
								'addresses',
								'boundaries',
								'boundary_labels',
								'bridges',
								'buildings',
								'dam_lines',
								'dam_polygons',
								'ferries',
								'land',
								'ocean',
								'pier_lines',
								'pier_polygons',
								'place_labels',
								'pois',
								'public_transport',
								'sites',
								'street_labels',
								'street_polygons',
								'streets',
								'water_lines',
								'water_polygons',
							],
						},
					})
				);

				map.addControl(createVersaTilesGeocoder(), 'top-left');

				// Keep the styler collapsed on mobile, where screen space is tight.
				const isMobile = window.matchMedia('(max-width: 639px)').matches;
				map.addControl(new VersaTilesStylerControl({ open: !isMobile }), 'top-left');
				map.addControl(new VersaTilesSVG.SVGExportControl(), 'top-right');

				// Link to the map editor, which is a site of its own in /editor/.
				map.addControl(
					{
						onAdd() {
							this.container = document.createElement('div');
							this.container.className = 'maplibregl-ctrl maplibregl-ctrl-group';
							const button = document.createElement('button');
							button.type = 'button';
							button.title = 'Open map editor';
							button.setAttribute('aria-label', button.title);
							button.innerHTML =
								'<svg viewBox="0 0 24 24" width="29" height="29" style="display: block; padding: 6px; box-sizing: border-box" fill="none" stroke="#333" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l1-5L16 4l4 4L9 19z M14 6l4 4" /></svg>';
							button.addEventListener('click', () => (window.location.href = '/editor/'));
							this.container.append(button);
							return this.container;
						},
						onRemove() {
							this.container.remove();
						},
					},
					'top-right'
				);

				// collapse attribution control
				document.getElementsByClassName('maplibregl-ctrl-attrib')[0].classList.remove('maplibregl-compact-show');
			});
		</script>
	</body>
</html>
