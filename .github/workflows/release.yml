name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_COLOR: 1

jobs:
  build:
    name: Build and test
    uses: ./.github/workflows/build-and-test.yml
    with:
      upload-release: true

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Get version and verify tag
        # Passed as env, not interpolated into the script, so a ref name cannot inject shell.
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          PKG_VERSION="v$(jq -r '.version' package.json)"
          # package.json is what we release. On a tag push the pushed tag must agree with it;
          # `git tag --list` cannot be used for that, since checkout fetches no tags at all on
          # a workflow_dispatch run and only the pushed one on a tag run.
          if [ "$REF_TYPE" = "tag" ] && [ "$REF_NAME" != "$PKG_VERSION" ]; then
            echo "::error::package.json version ($PKG_VERSION) does not match pushed tag ($REF_NAME)"
            exit 1
          fi
          echo "RELEASE_TAG=$PKG_VERSION" >> "$GITHUB_ENV"

      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          name: release
          path: release/

      - name: Create or reset release as draft
        # Ensure the release is a draft while assets upload, even on re-runs
        # where a previous attempt may have already created or published it.
        run: |
          gh release view $RELEASE_TAG >/dev/null 2>&1 \
            && gh release edit $RELEASE_TAG --draft=true \
            || gh release create $RELEASE_TAG --draft

      - name: Add files to release
        run: gh release upload $RELEASE_TAG --clobber release/*.tar.gz release/*.tar.zst

      - name: Update release
        run: gh release edit $RELEASE_TAG --draft=false --latest --prerelease=false --notes-file=release/notes.md

      # github.token cannot start workflows in other repositories, so mint a short-lived
      # token from the organisation's release GitHub App, for versatiles-docker and Actions only.
      - name: Create token for the Docker repository
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: versatiles-org
          repositories: versatiles-docker
          permission-actions: write

      # Only the frontend image changes. The inputs must match versatiles-docker's
      # release.yml exactly: GitHub rejects a dispatch that names an unknown input.
      - name: Trigger Docker release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh workflow run release.yml --repo versatiles-org/versatiles-docker --ref main \
            -f build_base=false \
            -f build_frontend=true \
            -f build_nginx=false \
            -f build_tippecanoe=false \
            -f build_gdal=false \
            -f build_planetiler=false
