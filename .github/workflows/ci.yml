name: CI

on:
  push:
    branches:
      - '**'
    tags:
      - '!**' # Don't run twice on commits with tags
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_COLOR: 1

jobs:
  build-and-test:
    name: Build and test
    uses: ./.github/workflows/build-and-test.yml

  checks:
    name: Lint and unit tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      # Report both versions rather than hiding the second failure behind the first.
      fail-fast: false
      matrix:
        include:
          # The floor declared in package.json "engines", and the version the release is built
          # with. Steps that check the repository rather than the runtime run only here.
          - node: '22'
            primary: true
          # What development actually runs on. Worth its own run: the unit tests drive a real
          # zstd stream through tar-stream when writing .tar.zst, and that combination has
          # already broken once in a Node-specific way - see the ZSTD_c_nbWorkers note in
          # src/frontend/frontend.ts, which CI on Node 22 alone could never have caught.
          - node: '24'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check vulnerabilities
        # All packages live under devDependencies (this is a build tool), so
        # `--omit=dev` would audit nothing. Audit the full tree, failing on high+.
        if: matrix.primary
        run: npm audit --audit-level=high

      - name: Check formatting
        if: matrix.primary
        run: npm run format:check

      # `vrt doc-insert` has no check mode, so regenerate and see whether anything moved.
      # The checkout is clean and thrown away afterwards, so rewriting README.md is safe.
      - name: Check documentation is up to date
        if: matrix.primary
        run: |
          npm run doc
          git diff --exit-code -- README.md || {
            echo "::error file=README.md::Generated documentation is out of date. Run 'npm run doc' and commit the result."
            exit 1
          }

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm run test-coverage

      - name: Upload test coverage
        # One upload is enough; both runs cover the same lines.
        if: matrix.primary
        uses: codecov/codecov-action@v7
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
